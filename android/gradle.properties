# Keep native builds usable alongside an emulator on machines with limited RAM.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
# Avoid a second compiler JVM and stale incremental storage after interrupted builds.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=false
org.gradle.parallel=false
org.gradle.daemon=false
android.useAndroidX=true
# Dependencies use AndroidX; avoid rewriting large Flutter engine JARs.
android.enableJetifier=false
# Use AGP 9's built-in Kotlin support (requires Flutter 3.47+).
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
